[server]
# Transformers exposes optional vision modules lazily. Streamlit's source
# watcher probes those modules and produces noisy `torchvision` errors even
# though this text-only app does not use vision features.
fileWatcherType = "none"

[theme]
primaryColor = "#D9731F"
backgroundColor = "#FBF6F0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"
